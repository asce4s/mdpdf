name: Verify browser app
on:
  push:
    branches: [browser-only]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish the verified static build to GitHub Pages
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.1
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: npm ci --ignore-scripts
      - run: cargo install cargo-leptos --version 0.3.6 --locked
      - run: npm run build
      - run: cargo fmt --check && cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked && cargo check -p mdpdf-core --target wasm32-unknown-unknown --locked
      - run: npm run lint && node --test crates/mdpdf-core/tests/bootstrap.test.cjs && python3 scripts/check_assets.py
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        with:
          name: browser-site
          path: target/browser
          include-hidden-files: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/download-artifact@v4
        with:
          name: browser-site
          path: site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
