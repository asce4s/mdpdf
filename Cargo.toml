[workspace]
members = ["crates/mdpdf-core", "crates/mdpdf-render", "crates/mdpdf-app", "crates/mdpdf-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"

[workspace.dependencies]
mdpdf-core = { path = "crates/mdpdf-core" }
mdpdf-render = { path = "crates/mdpdf-render" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
toml = "=0.8.23"
comrak = { version = "=0.57.0", default-features = false }
ammonia = "=4.2.4"
syntect = { version = "=5.3.0", default-features = false, features = ["parsing", "default-syntaxes", "html", "regex-fancy"] }
serde-saphyr = { version = "=1.3.0", default-features = false, features = ["deserialize"] }
insta = "=1.49.0"
leptos = { version = "=0.8.22", default-features = false }
chromiumoxide = "=0.9.1"
lopdf = { version = "=0.46.0", default-features = false }
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "signal"] }
clap = { version = "=4.6.7", features = ["derive"] }
futures-util = "=0.3.34"
base64 = "=0.23.1"
getrandom = "=0.4.3"
tempfile = "=3.27.0"
axum = { version = "=0.8.9", features = ["multipart"] }
leptos_axum = "=0.8.10"
leptos_meta = "=0.8.7"
tower-http = { version = "=0.7.1", features = ["fs", "compression-gzip", "trace"] }
wasm-bindgen = "=0.2.129"
js-sys = "=0.3.106"
web-sys = { version = "=0.3.106", features = ["Window", "Document", "CustomEvent", "EventTarget", "CustomEventInit"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "stream"] }
sha2 = "=0.11.1"

[profile.wasm-release]
inherits = "release"
opt-level = "z"
panic = "abort"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = true
codegen-units = 1
